[package]
name = "sbf-estante"
description = "Estante (documentos organizados por ciclo e tipo) e cópia de segurança cifrada do cofre, ambas no Drive via rclone. Sem egui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bancada-armazem = { workspace = true }
bancada-segredos = { workspace = true }
# Senha gerada e sal da cópia de segurança (MIT OR Apache-2.0); a mesma da bancada.
getrandom = "0.4"
rusqlite = { workspace = true }
# A regra única de como chamar um programa externo (ADR-012).
sbf-processo = { path = "../sbf-processo" }
sha2 = "0.10"
tempfile = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = "0.1"
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
