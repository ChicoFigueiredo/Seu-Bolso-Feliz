[package]
name = "sbf-previa"
description = "Prévia do arquivo de um documento: páginas de PDF, imagens, e-mail, texto, Office e zip, em memória. Sem egui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sbf-pdf = { path = "../sbf-pdf" }
sbf-processo = { path = "../sbf-processo" }
thiserror = { workspace = true }
zeroize = { workspace = true }
# A mesma versão do sbf-pdf: conta as páginas e decifra o PDF protegido em memória (MIT).
lopdf = { version = "=0.47.0", default-features = false }
# Imagens (MIT OR Apache-2.0), só os formatos da prévia; pnm lê a saída do pdftoppm.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "pnm"] }
# E-mail .eml (Apache-2.0 OR MIT); também converte HTML em texto.
mail-parser = { version = "0.11", default-features = false }
# A lista de um zip, sem extrair (MIT); sem compressão: só lê o diretório central. 9.x: a 2.x
# tem o aviso GHSA-q7v9-x93c-xqv3.
zip = { version = "9", default-features = false }
# sha256 dos anexos, para ligar ao content_hash (MIT OR Apache-2.0).
sha2 = "0.11"

[dev-dependencies]
tempfile = { workspace = true }
png = "0.18"
lopdf = { version = "=0.47.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "9", default-features = false }

[lints]
workspace = true
