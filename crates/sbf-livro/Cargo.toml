[package]
name = "sbf-livro"
description = "Domínio do livro-caixa: tipos em centavos e as regras portadas do TS (ciclo, direção do rateio, amortização, equivalente mensal, números da Hoje, gasto pela data da compra). Sem rede, sem banco, sem egui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["relatorios", "contrato"]
# Implementa o `FonteDeGastos` do `sbf-inventario` sobre o livro-caixa. O servidor pode
# desligar (`default-features = false`) para não puxar o inventário.
relatorios = ["dep:sbf-inventario"]
# Converte as linhas do contrato HTTP (`sbf-contrato`) nos tipos do livro.
contrato = ["dep:sbf-contrato"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
sbf-inventario = { workspace = true, optional = true }
sbf-contrato = { path = "../sbf-contrato", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
# O teste do ciclo compara com o `ciclo_da_data` do inventário (EST-12), com ou sem a feature.
sbf-inventario = { workspace = true }

[lints]
workspace = true
