[package]
name = "sbf-livro"
description = "Domínio do livro-caixa: tipos em centavos e as regras portadas do TS (ciclo, direção do rateio, amortização, equivalente mensal, números da Hoje, gasto pela data da compra). Sem rede, sem banco, sem egui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["relatorios"]
# Implementa o `FonteDeGastos` do `sbf-inventario` sobre o livro-caixa. O servidor pode
# desligar (`default-features = false`) para não puxar o inventário.
relatorios = ["dep:sbf-inventario"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
sbf-inventario = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
