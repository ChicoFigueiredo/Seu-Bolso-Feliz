[package]
name = "sbf-mcp"
description = "Servidor MCP local (stdio) do SBF: o Claude consulta, aplica (com autor mcp, backup e Desfazer) e propõe sugestões para a triagem do usuário."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sbf-inventario = { workspace = true }
sbf-triagem = { path = "../sbf-triagem" }
sbf-indice = { path = "../sbf-indice" }
sbf-ia = { path = "../sbf-ia" }
sbf-planejamento = { path = "../sbf-planejamento" }
sbf-regras = { workspace = true }
sbf-script = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SDK oficial do MCP (Apache-2.0). Só servidor, por stdio.
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
