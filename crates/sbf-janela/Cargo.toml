[package]
name = "sbf-janela"
description = "A interface egui do Seu Bolso Feliz: áreas, tabelas, páginas de item, rastro, Ações do §10, lotes, painéis e o modo demonstração."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sbf-inventario = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
bancada-casca = { path = "../../../bancada/crates/bancada-casca" }
sbf-pdf = { path = "../sbf-pdf" }
sbf-chaveiro = { path = "../sbf-chaveiro" }
sbf-estante = { path = "../sbf-estante" }
sbf-processo = { path = "../sbf-processo" }
sbf-previa = { path = "../sbf-previa" }
sbf-triagem = { path = "../sbf-triagem" }
sbf-indice = { path = "../sbf-indice" }
sbf-planejamento = { path = "../sbf-planejamento" }
sbf-planilha = { path = "../sbf-planilha" }
sbf-reconhecimento = { path = "../sbf-reconhecimento" }
sbf-regras = { workspace = true }
sbf-pontos = { path = "../sbf-pontos" }
sbf-ia = { path = "../sbf-ia" }
sbf-worker = { path = "../sbf-worker" }
sbf-mensageiros = { path = "../sbf-mensageiros" }
sbf-telegram = { path = "../sbf-telegram" }
sbf-roteiros = { path = "../sbf-roteiros" }
# QR do pareamento do WhatsApp (MIT OR Apache-2.0); só desenhamos a matriz.
qrcode = { version = "0.14", default-features = false }
# Só para o acervo fictício da demonstração (o anexo do e-mail liga ao achado pelo sha256).
sha2 = "0.11"
zeroize = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
bancada-segredos = { workspace = true, features = ["testes"] }
tempfile = { workspace = true }
sbf-estacao = { path = "../sbf-estacao" }
sbf-livro = { path = "../sbf-livro" }

[lints]
workspace = true
