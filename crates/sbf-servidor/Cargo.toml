[package]
name = "sbf-servidor"
description = "O modo `sbf servidor` (spec 07, ADR-013): API HTTP do livro-caixa, autenticação de estação e leitura do Postgres com filtro por dono."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sbf-contrato = { path = "../sbf-contrato" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
ring = "0.17"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
