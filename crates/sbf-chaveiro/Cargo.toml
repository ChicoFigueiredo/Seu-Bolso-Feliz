[package]
name = "sbf-chaveiro"
description = "O chaveiro do Seu Bolso Feliz sobre bancada-segredos: importa o segredos/cofre.enc antigo e guarda o CPF e as senhas por rótulo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bancada-segredos = { workspace = true }
# Só pelo trait FonteDeSegredos, que o chaveiro implementa para a abertura de PDF protegido.
sbf-pdf = { path = "../sbf-pdf" }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Leitura do cofre.enc antigo (RustCrypto, MIT OR Apache-2.0): scrypt com os N, r e p do
# próprio arquivo e AES-256-GCM.
scrypt = { version = "0.12", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
# base64 do cofre.enc (MIT OR Apache-2.0).
base64 = "0.22"
# Comparação em tempo constante na conferência da importação (BSD-3-Clause).
subtle = "2.6"

[dev-dependencies]
bancada-segredos = { workspace = true, features = ["testes"] }
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
