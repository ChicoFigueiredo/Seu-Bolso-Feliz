[package]
name = "sbf-telegram"
description = "Telegram pela conta do usuário (MTProto, grammers): trait FonteTelegram, sessão no chaveiro, seguir conversas, coleta de mídias para o inventário com reconhecimento."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sbf-coleta = { path = "../sbf-coleta" }
sbf-chaveiro = { path = "../sbf-chaveiro" }
sbf-mensageiros = { path = "../sbf-mensageiros" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
# MTProto puro em Rust (MIT OR Apache-2.0). Todos os grammers na mesma versão.
grammers-client = "0.12.0"
grammers-mtsender = "0.12.0"
grammers-session = { version = "0.12.0", default-features = false, features = ["serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }
bancada-segredos = { workspace = true, features = ["testes"] }
sbf-inventario = { workspace = true }

[lints]
workspace = true
