[package]
name = "sbf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sbf-janela = { path = "../sbf-janela" }
bancada-casca = { path = "../../../bancada/crates/bancada-casca" }
sbf-inventario = { workspace = true }
sbf-estacao = { path = "../sbf-estacao" }
bancada-rede = { path = "../../../bancada/crates/bancada-rede" }
sbf-disco = { path = "../sbf-disco" }
eframe = { workspace = true }
egui = { workspace = true }
