[package]
name = "sbf-pontos"
description = "Pontos de atenção (spec 10): análise periódica por regras e sem IA sobre o inventário, o cache do livro-caixa e saida_ia; pontos.sqlite com estado, motivo e deduplicação."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Só `Data` e `Ciclo` (o dia civil e o ciclo financeiro); sem inventário nem contrato.
sbf-livro = { path = "../sbf-livro", default-features = false }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
tempfile = { workspace = true }
sbf-inventario = { workspace = true }
sbf-triagem = { path = "../sbf-triagem" }

[lints]
workspace = true
