# Deploy — ambiente único de produção.
#
# Staging foi eliminado por decisão do CEO. A premissa que torna isso razoável
# está registrada: o produto tem UM ÚNICO usuário, que é o próprio CEO. Se
# aparecer um segundo usuário, esta decisão cai e staging volta.
#
# Compensações pela ausência de pré-produção, todas obrigatórias:
#   1. o ci.yml reconstrói o schema do zero a cada PR, provando que a linha de
#      base mais as migrations chegam ao mesmo lugar;
#   2. todo arquivo de migration carrega um bloco `-- rollback:` revisado;
#   3. dump do banco como artifact ANTES de qualquer migration;
#   4. portão humano: environment `production` com required reviewer, e
#      workflow_dispatch — nunca dispara sozinho num push.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Pular o deploy de migrations"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  database:
    name: Migrations (Neon)
    if: ${{ !inputs.skip_migrations }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # `psql` do cliente 17 — o servidor do Neon é 17, e um cliente antigo
      # recusa o dump com "server version mismatch".
      - name: Instalar o cliente do Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      # Rede de segurança obrigatória sem staging: se uma migration corromper
      # dados, este dump é o caminho de volta. Vem ANTES de qualquer DDL.
      - name: Backup antes de migrar
        run: pg_dump "$DATABASE_URL_UNPOOLED" --no-owner --no-acl -f "backup-$(date -u +%Y%m%dT%H%M%SZ).sql"
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: backup-*.sql
          retention-days: 30

      # `scripts/aplicar-migrations.sh` é o único caminho de migration do
      # projeto: aplica `packages/db/migrations/*.sql` em ordem, cada uma numa
      # transação, pela conexão direta (DDL pelo pooler pode trocar de backend
      # no meio do trabalho). As migrations são idempotentes.
      - name: Aplicar migrations
        run: bash scripts/aplicar-migrations.sh
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

  web:
    name: Web (Vercel)
    needs: [database]
    # `always()` para que pular migrations não bloqueie o deploy web.
    if: ${{ always() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Vercel pull
        run: bunx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build
        run: bunx vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Vercel deploy
        run: bunx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
