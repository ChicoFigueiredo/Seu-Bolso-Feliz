# CI — verificação de todo push e PR.
#
# Substitui os stages validate/install/check/test/build do .gitlab-ci.yml.
#
# Diferença importante em relação ao pipeline anterior: o filtro de caminhos
# dos testes de integração incluía só um punhado de diretórios (o antigo
# diretório do backend, packages/domain/** e packages/validation/**), de modo
# que NENHUMA mudança em workers/ingestion jamais disparou os testes de
# integração. Aqui os testes rodam sempre.
name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  check:
    name: Tipos, lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Mesma versão usada no desenvolvimento. O pipeline anterior fixava
          # 1.3.10 enquanto o dev rodava 1.3.11.
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Formatação
        run: bun run format:check

      # Sem tolerância: os 5 erros pré-existentes foram corrigidos, e três deles
      # eram consultas a colunas inexistentes que quebravam o `next build` — ou
      # seja, o deploy no Vercel. Deixar passar de novo custaria a produção.
      - name: Typecheck
        run: bun run typecheck

  validate-commits:
    name: Convenção de commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD

  test:
    name: Testes (unit, integração, e2e)
    runs-on: ubuntu-latest

    # Postgres de verdade, não dublê. Os testes de integração exercitam
    # trigger, constraint, SKIP LOCKED e LISTEN/NOTIFY — nada disso existe num
    # mock, e é justamente onde os defeitos moram.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sbf
          POSTGRES_PASSWORD: sbf
          POSTGRES_DB: sbf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Três variáveis distintas de propósito: cada suíte semeia e apaga dados,
      # e nenhuma delas pode cair na DATABASE_URL de alguém por engano. Sem a
      # variável, a suíte correspondente se pula — foi assim que 14 arquivos de
      # teste ficaram quebrados por semanas sem ninguém ver.
      INTEGRATION_TEST_DATABASE_URL: postgresql://sbf:sbf@127.0.0.1:5432/sbf
      TEST_DATABASE_URL: postgresql://sbf:sbf@127.0.0.1:5432/sbf
      QUEUE_TEST_DATABASE_URL: postgresql://sbf:sbf@127.0.0.1:5432/sbf
      DATABASE_URL: postgresql://sbf:sbf@127.0.0.1:5432/sbf

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # schema.sql é o DDL canônico; as migrations por cima são o delta desde
      # o snapshot. Aplicar as duas coisas do zero a cada run é o que garante
      # que elas realmente reconstroem o banco.
      - name: Aplicar schema e migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f packages/db/schema.sql
          for m in packages/db/migrations/*.sql; do
            echo "→ $(basename "$m")"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$m"
          done

      # Falha alto se alguém adicionar uma suíte que se pula em silêncio: um
      # teste pulado passa no CI e não protege nada.
      - name: Conferir que nenhuma suíte de integração está sendo pulada
        run: |
          if bunx vitest run --project integration --reporter=json 2>/dev/null \
             | grep -q '"status":"skipped"'; then
            echo "::error::Há teste de integração sendo pulado — provavelmente falta variável de banco."
            exit 1
          fi

      - name: Testes unitários
        run: bun run test:unit

      - name: Testes de integração
        run: bun run test:integration

      - name: Testes E2E
        run: bunx vitest run --project e2e

  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build
        # Valores de fachada: o build não abre conexão nem assina nada, mas
        # AUTH_SECRET tem validação de tamanho e o build reclama sem ele.
        env:
          AUTH_SECRET: apenas-para-o-build-nao-vale-em-lugar-nenhum-000
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
