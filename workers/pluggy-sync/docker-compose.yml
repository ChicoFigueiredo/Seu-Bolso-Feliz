# Deploy do worker pluggy-sync numa VPS. Uso completo:
# docs/integrations/pluggy-deploy.md — este arquivo só orquestra o
# container; segredos vêm de um `.env` neste mesmo diretório (nunca
# commitado — ver .env.example ao lado).
services:
  pluggy-sync:
    build:
      context: ../..
      dockerfile: workers/pluggy-sync/Dockerfile
    image: sbf/pluggy-sync:latest
    container_name: sbf-pluggy-sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
    # HEALTHCHECK já está definido na imagem (Dockerfile) — fonte única,
    # não duplicado aqui pra não divergir.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
